[package]
name = "interface"
version = "0.1.0"
edition = "2021"
license.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", optional = true, features = ["derive"] }
bincode = { version = "1", optional = true }

[features]
default = []
cartridge-serde = ["dep:serde", "dep:bincode"]

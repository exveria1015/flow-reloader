[package]
name = "tauri_tokio"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
flow_reload = { path = "../../../flow_reload", features = ["tokio"] }
tauri_tokio_logic = { path = "../../tauri_tokio_logic" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "net", "io-util"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

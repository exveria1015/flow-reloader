[package]
name = "flow_reload"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
interface = { path = "../interface" }
hot_macro = { path = "../hot_macro" }
libloading = { version = "0.8", optional = true }
notify = { version = "6", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[features]
default = ["native", "dev-tools"]
native = ["dep:libloading", "dep:libc", "dep:windows-sys"]
dev-tools = ["native", "dep:notify"]

[[bin]]
name = "flow-cache"
required-features = ["native"]

[[example]]
name = "contracts"
required-features = ["dev-tools"]

[[example]]
name = "threaded_io"
required-features = ["dev-tools"]

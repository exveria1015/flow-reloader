[package]
name = "tauri_tokio"
version = "0.1.0"
edition = "2021"
license.workspace = true
build = "build.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
flow_reload = { path = "../../../flow_reload" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]

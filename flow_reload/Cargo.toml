[package]
name = "flow_reload"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
interface = { path = "../interface" }
hot_macro = { path = "../hot_macro" }
libloading = "0.8"
notify = "6"
tokio = { version = "1", optional = true, features = ["rt", "time", "net", "io-util"] }
async-std = { version = "1", optional = true }
smol = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[features]
default = []
tokio = ["dep:tokio"]
async-std = ["dep:async-std"]
smol = ["dep:smol"]
cartridge-serde = ["interface/cartridge-serde"]
